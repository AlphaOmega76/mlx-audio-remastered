<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MLX-Audio Reader settings</title>
    <style>
      body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #111827; }
      h1 { font-size: 20px; margin: 0 0 20px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input, select, textarea { width: 100%; padding: 8px; font: inherit; border: 1px solid #d1d5db; border-radius: 6px; }
      .row { display: flex; align-items: center; gap: 12px; }
      .row input[type=range] { flex: 1; padding: 0; }
      .hint { color: #6b7280; font-size: 12px; margin-top: 4px; }
      .actions { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
      button { background: #0ea5e9; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
      #status { color: #6b7280; }
      #status.ok { color: #15803d; }
      #status.bad { color: #b91c1c; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>MLX-Audio Reader settings</h1>

    <label for="serverUrl">MLX-Audio server address</label>
    <input id="serverUrl" type="url" spellcheck="false" />
    <div class="hint">Where your MLX-Audio app is running. The default is http://localhost:8000.</div>

    <label for="model">Voice model</label>
    <select id="model"></select>

    <label for="voice">Voice</label>
    <select id="voice"></select>

    <div id="instructionRow">
      <label for="instruction">Speaking style</label>
      <textarea id="instruction" rows="2" placeholder="Describe the speaking style (leave empty for none)"></textarea>
    </div>

    <label for="speed">Speed: <span id="speedValue"></span></label>
    <div class="row"><span>Slow</span><input id="speed" type="range" min="0.5" max="2" step="0.1" /><span>Fast</span></div>

    <div class="actions">
      <button id="test">Test connection</button>
      <span id="status"></span>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
